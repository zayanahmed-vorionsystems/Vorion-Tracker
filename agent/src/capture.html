<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkTrack Capture</title>
    <style>
      html, body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
      body { display: grid; place-items: center; min-height: 100vh; }
      .status { font-size: 14px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="status" id="status">Initializing screen capture…</div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const status = document.getElementById('status');
        if (status) {
          status.textContent = 'Loading capture renderer...';
        }
        console.log('[AGENT] capture.html DOM loaded');
      });
    </script>
    <script src="./capture-renderer.js"></script>
  </body>
</html>
